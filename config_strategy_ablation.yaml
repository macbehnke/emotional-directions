top_k: 10
languages: ["en", "pl", "zh"]
candidate_root: "data/candidates"
cache_path: "cache/embeddings_cache_3models.jsonl"
output_dir: "outputs/strategy_ablation"
search_scope: "category"
exclude_query_terms_from_candidates: true
random_seed: 42
bootstrap_iterations: 30

# Strategy-selection run. Use this after/past the pilot to decide whether
# centroid_phrases should remain the final strategy.
emotion_representation_strategies:
  - single_word
  - feeling_phrase
  - centroid_words
  - centroid_phrases

neutral_strategies:
  - neutral_centroid

control_conditions:
  - emotion
  - identity
  - random
  - shuffled_emotion

discrete_emotion_lexicon_paths: {}

models:
  gemini:
    enabled: true
    backend: gemini
    model_id: "models/gemini-embedding-001"
    embedding_dimension: 3072
    normalize: true

  qwen3_embedding_8b:
    enabled: true
    backend: sentence-transformers
    model_id: "Qwen/Qwen3-Embedding-8B"
    embedding_dimension: 4096
    normalize: true

  arctic_embed_l_v2:
    enabled: true
    backend: sentence-transformers
    model_id: "Snowflake/snowflake-arctic-embed-l-v2.0"
    embedding_dimension: null
    normalize: true

  mmlw_roberta_large:
    enabled: true
    backend: sentence-transformers
    model_id: "sdadas/mmlw-roberta-large"
    embedding_dimension: null
    normalize: true

  bielik_1_5b_v3:
    enabled: true
    backend: bielik
    model_id: "speakleash/Bielik-1.5B-v3.0-Instruct"
    embedding_dimension: null
    pooling_strategy: mean
    normalize: true
    device: auto
    torch_dtype: auto
    max_length: 128
    trust_remote_code: true

categories:
  food:
    en: "food"
    pl: "jedzenie"
    zh: "食物"
  person:
    en: "person"
    pl: "osoba"
    zh: "人"
  object:
    en: "object"
    pl: "przedmiot"
    zh: "物品"
  place:
    en: "place"
    pl: "miejsce"
    zh: "地方"
  situation:
    en: "situation"
    pl: "sytuacja"
    zh: "情况"

emotions:
  sadness:
    en:
      single_word: "sadness"
